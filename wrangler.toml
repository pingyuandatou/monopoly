name = "monopoly"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# 只用自定义域名，不开 workers.dev 和预览地址。
workers_dev = false
preview_urls = false

# 静态页面由 Worker 转发；/api/* 在 Worker 里处理。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# 每个房间一个 Durable Object，SQLite 持久化对局。
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 想绑定自己的域名，取消下面的注释并换成你的域名（需已托管在 Cloudflare）。
# [[routes]]
# pattern = "game.example.com"
# custom_domain = true
