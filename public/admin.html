<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>大富翁 · 管理</title>
    <meta name="theme-color" content="#0f1c18" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="admin">
    <div id="toast" role="status"></div>

    <header class="topbar">
      <span class="mark" aria-hidden="true">富</span>
      <span class="wordmark">大富翁</span>
      <span class="admin-tag">管理</span>
      <span class="grow"></span>
      <button type="button" class="ghost" id="btn-refresh" hidden>刷新</button>
      <button type="button" class="ghost" id="btn-logout" hidden>退出</button>
    </header>

    <main class="admin-main">
      <form id="login" class="ticket admin-login" aria-labelledby="login-title" hidden>
        <div>
          <h2 id="login-title">管理入口</h2>
          <p class="hint">输入管理密钥。密钥只存在这个浏览器里，关掉标签页就忘掉。</p>
        </div>
        <label>管理密钥<input id="key" type="password" autocomplete="current-password" required /></label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button type="submit" class="primary big">进入</button>
      </form>

      <section id="panel" hidden>
        <div class="admin-head">
          <div>
            <h1>房间</h1>
            <p id="summary" class="admin-summary"></p>
          </div>
          <div class="seg admin-filter" role="tablist" aria-label="按状态筛选">
            <button type="button" role="tab" data-filter="all" aria-selected="true">全部</button>
            <button type="button" role="tab" data-filter="playing" aria-selected="false">对局中</button>
            <button type="button" role="tab" data-filter="lobby" aria-selected="false">等待开局</button>
            <button type="button" role="tab" data-filter="finished" aria-selected="false">已结束</button>
          </div>
        </div>
        <p class="note admin-note">房间在有人进出、开局、结束时登记到这里，最多晚几秒。超过 <b id="idle-hours">72</b> 小时没人动的房间会自动删除。</p>
        <div id="rooms" class="admin-rooms"></div>
      </section>
    </main>

    <div id="detail" class="overlay mid" hidden>
      <div class="modal admin-detail" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <header>
          <h3 id="detail-title"></h3>
          <button type="button" class="ghost dark" data-close>关闭</button>
        </header>
        <div id="detail-body"></div>
      </div>
    </div>

    <div id="confirm" class="overlay mid" hidden>
      <div class="modal admin-confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
        <h3 id="confirm-title"></h3>
        <p id="confirm-text" class="act-text"></p>
        <div class="actions"><div class="row">
          <button type="button" class="secondary" id="confirm-no">取消</button>
          <button type="button" class="primary" id="confirm-yes">确定</button>
        </div></div>
      </div>
    </div>

    <script src="/admin.js"></script>
  </body>
</html>
